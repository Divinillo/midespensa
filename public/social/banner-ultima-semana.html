<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<title>MiDespensa · Última semana PRO gratis</title>
</head>
<body style="margin:0;padding:0;width:1080px;height:1080px;overflow:hidden;font-family:'Inter',sans-serif;background:linear-gradient(160deg,#1a1a2e 0%,#16213e 50%,#0f1724 100%);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;">

  <!-- Gold accent glow -->
  <div style="position:absolute;top:28%;left:50%;transform:translate(-50%,-50%);width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,0.10) 0%,transparent 70%);"></div>
  <div style="position:absolute;bottom:8%;right:8%;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,0.06) 0%,transparent 70%);"></div>

  <div style="position:relative;z-index:2;text-align:center;padding:80px;width:100%;box-sizing:border-box;">

    <!-- Logo -->
    <div style="margin-bottom:40px;">
      <span style="font-size:22px;font-weight:700;color:rgba(245,158,11,0.6);letter-spacing:1px;">MiDespensa</span>
    </div>

    <!-- Urgency pill -->
    <div style="display:inline-block;background:rgba(245,158,11,0.12);border:2px solid rgba(245,158,11,0.45);border-radius:40px;padding:14px 42px;margin-bottom:44px;">
      <span style="font-size:24px;font-weight:800;color:#f59e0b;text-transform:uppercase;letter-spacing:4px;">⏰ Última semana</span>
    </div>

    <!-- Title -->
    <h1 style="margin:0 0 20px 0;font-size:104px;font-weight:900;color:#ffffff;line-height:1.02;letter-spacing:-4px;">
      PRO gratis
    </h1>
    <p style="margin:0 0 56px 0;font-size:28px;font-weight:600;color:rgba(255,255,255,0.5);">
      Solo hasta el 31 de agosto
    </p>

    <!-- Two ways -->
    <div style="display:flex;gap:28px;justify-content:center;margin-bottom:56px;">
      <div style="flex:1;max-width:380px;background:rgba(255,255,255,0.04);border:1px solid rgba(245,158,11,0.18);border-radius:28px;padding:38px 26px;">
        <div style="font-size:64px;font-weight:900;color:#f59e0b;line-height:1;">+7</div>
        <div style="font-size:20px;font-weight:700;color:rgba(245,158,11,0.7);margin-top:6px;">días Pro</div>
        <div style="font-size:26px;font-weight:700;color:#ffffff;margin-top:22px;line-height:1.3;">Reseña en<br>Google Play</div>
      </div>
      <div style="flex:1;max-width:380px;background:rgba(255,255,255,0.04);border:1px solid rgba(245,158,11,0.18);border-radius:28px;padding:38px 26px;">
        <div style="font-size:64px;font-weight:900;color:#f59e0b;line-height:1;">+7</div>
        <div style="font-size:20px;font-weight:700;color:rgba(245,158,11,0.7);margin-top:6px;">días Pro</div>
        <div style="font-size:26px;font-weight:700;color:#ffffff;margin-top:22px;line-height:1.3;">Por cada amigo<br>que invites</div>
      </div>
    </div>

    <!-- Divider -->
    <div style="width:60px;height:3px;background:linear-gradient(90deg,#f59e0b,#d97706);border-radius:2px;margin:0 auto 40px auto;"></div>

    <div style="display:inline-block;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.2);border-radius:40px;padding:14px 36px;">
      <span style="font-size:18px;font-weight:600;color:rgba(245,158,11,0.8);">midespensa.app</span>
    </div>
  </div>

</body>
</html>
